name: Build SpotyLink APK Nativo

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceitar licenças e verificar SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" || true

      - name: Download Gradle Wrapper JAR
        working-directory: android-app
        run: |
          mkdir -p gradle/wrapper
          curl -sL -o gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar"

      - name: Tornar gradlew executável
        working-directory: android-app
        run: chmod +x gradlew

      - name: Compilar APK Debug
        working-directory: android-app
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Preparar APK para download
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk SpotyLink.apk

      - name: Upload SpotyLink APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotyLink-APK
          path: SpotyLink.apk
          if-no-files-found: error

      - name: Criar Release com Link Direto do APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "SpotyLink v1.0.0 (APK Oficial)"
          body: |
            🎵 **SpotyLink para Android (Nativo)**
            - Sem terminal e sem localhost
            - Toca com tela bloqueada e controle de fone/carro
            - Permite baixar músicas e importar arquivos locais do celular
            
            👉 **Clique em `SpotyLink.apk` abaixo para baixar e instalar no celular!**
          files: SpotyLink.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
